<!doctype html>

  <head>

    <!--
      DIRECTION CONTRACT
      THESIS: A corner-colored fight terminal. The octagon's own red/blue
      grammar organizes every number on screen; refuses the generic
      KPI-card dashboard of same-size stat tiles.
      OWN-WORLD: near-black blue-cast ground; tabular Fira Code numerals
      for every datum; red-corner vs blue-corner duotone carries meaning,
      amber is reserved for market movement. With all content removed you
      still see opposing red/blue halves on a dark terminal.
      STORY: between rounds, one glance answers "who is winning the fight,
      and who does the money think wins" — then eyes back on the TV.
      FIRST VIEWPORT: left rail is the fight card; center is the live bout
      (tale of the tape + per-source round-score grid + round prose);
      right rail stacks the three markets red-vs-blue with native prices.
      Freshness stamped on every data panel; synthetic data labeled.
      FORM: broadcast scoreboard x betting-exchange terminal. Chosen
      directly in an unattended run (no seed roll available); Operate mode.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>UFC Live Dashboard</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
