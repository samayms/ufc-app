<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <!--
      DIRECTION CONTRACT
      THESIS: A pocket fight desk organized by the octagon's red/blue corner
      grammar, refusing both generic SaaS cards and a miniature desktop.
      OWN-WORLD: warm-black broadcast surfaces; Barlow Condensed display type;
      IBM Plex Mono data; hairline dividers; red/blue comparisons and amber
      market notation. With all text removed, the opposing corners remain.
      STORY: between rounds, one glance answers what happened, how it was
      scored, and where the markets stand; detail stays one tap away.
      FIRST VIEWPORT: a safe-area event strip, opposing fighter portrait
      markers around the fight state, one market strip, compact section and
      round controls, then the latest round comparison, score, and summary.
      FORM: mobile broadcast scorebug crossed with a ringside notebook.
      Operate mode; the exported prototype fixes the composition and world.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <meta name="theme-color" content="#14110f" />
    <title>UFC Live Companion</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
