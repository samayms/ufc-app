<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <!--
      DIRECTION CONTRACT
      THESIS: A pocket fight desk organized by the octagon's red/blue corner
      grammar, refusing both generic SaaS cards and a miniature desktop.
      OWN-WORLD: warm-black broadcast surfaces; Asap Condensed display type;
      Schibsted Grotesk UI and tabular data; hairline dividers; red/blue
      comparisons and amber market notation. With all text removed, the
      opposing corners remain.
      STORY: between rounds, one glance answers what happened, how it was
      scored, and where the markets stand; detail stays one tap away.
      FIRST VIEWPORT: a safe-area event strip, opposing fighter portrait
      markers around the fight state, one market strip, compact section and
      round controls, then the latest round comparison, score, and summary.
      FORM: mobile broadcast scorebug crossed with a ringside notebook.
      Operate mode; the exported prototype fixes the composition and world.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Asap+Condensed:wght@400;500;600;700;800&family=Schibsted+Grotesk:wght@400;500;600;700;800&family=Barlow+Semi+Condensed:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&family=Bebas+Neue&display=swap"
      rel="stylesheet"
    />
    <meta name="theme-color" content="#14110f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="UFC Live" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/ufc-app-icon-180.png" />
    <link rel="icon" href="/icons/ufc-app-icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>UFC Live Companion</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
