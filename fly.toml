# Fly.io app config: one Machine running Node (API + SSE + collector +
# scheduler) behind Litestream, backed by a single SQLite volume.
#
# No Managed Postgres, no second Machine, no release_command — the release
# Machine does not have the /data volume attached, so migrations run at
# application startup instead (see server/main.ts).

app = "ufc-live-dashboard"
primary_region = "ewr"

[build]

[env]
  DB_PATH = "/data/ufc.db"
  DATA_MODE = "live"
  PERSISTENCE_PATH = "/data"
  SHERDOG_PERMISSION_SCOPE = "sherdog-read"
  SHERDOG_REQUEST_INTERVAL_MS = "10000"

[[mounts]]
  source = "ufc_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  # Bumped from 512mb (2026-08-04): market-ticks.jsonl retains every accepted
  # tick by design (src/sources/contract.ts) and is fully replayed into
  # memory on boot (server/tickStore.ts restoreFromStorage). It had grown to
  # ~147MB, and parsing that into MarketTick objects pushed V8's heap past
  # 512mb, OOM-crash-looping the machine until it exhausted its restart
  # budget and Fly stopped it. 512mb was only ever sized for the empty-store
  # case. Revisit if this keeps climbing — either size up again or make tick
  # retention deliberately bounded (a product decision, not one to make
  # silently) — see PROGRESS.md.
  memory = "2048mb"

[http_service]
  internal_port = 8600
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "30s"
    interval = "15s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

# The container's ENTRYPOINT (see Dockerfile) already runs
# `litestream replicate -exec "node server/main.ts"` — no [processes]
# override needed here.
